{% extends "base.html" %}

{% load static%}

{% block title %}
home | hospital
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Register Form</h2>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</div>
{% endblock %}
